api:
  dashboard: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: web
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  dnsresolver:
    acme:
      email: me@vkuberan.in
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: digitalocean
        propagation:
          delayBeforeChecks: 120s

log:
  level: INFO

accessLog: {}
